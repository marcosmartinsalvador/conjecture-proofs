name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    name: Front page matches the result folders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_index.py --check

  lean:
    name: Every proof is accepted by the checker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and Mathlib
        run: ./setup.sh
      - name: Run the checker on every result
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          failed=0
          for d in conjectures/*/; do
            s="$(basename "$d")"
            if tools/check_lean.sh "$s" > "/tmp/$s.txt" 2>&1; then
              head -1 "/tmp/$s.txt"
            else
              echo "::error::$s was not accepted"
              cat "/tmp/$s.txt"
              failed=1
            fi
          done
          exit "$failed"
